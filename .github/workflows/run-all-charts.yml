name: Run All Charts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"  # 13h UTC = 15h Paris (CEST, UTC+2)

jobs:
  run-all-charts:
    runs-on: ubuntu-latest
    environment: .env
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(pip show playwright | grep Version | cut -d' ' -f2)" >> $GITHUB_ENV

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Install Playwright system deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run all charts (no post)
        run: python -m tsm collect charts --no-post

      - name: Download YouTube CSV history from R2
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import boto3

          bucket = os.environ.get("R2_BUCKET", "taylor-data")
          client = boto3.client(
              "s3",
              endpoint_url=f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto",
          )
          Path("db").mkdir(exist_ok=True)
          for key, dest in {
              "data/youtube_views_history.csv": Path("db/youtube_views_history.csv"),
              "data/youtube_title_history.csv": Path("db/youtube_title_history.csv"),
          }.items():
              try:
                  client.download_file(bucket, key, str(dest))
                  print(f"downloaded {key} -> {dest}")
              except Exception as exc:
                  print(f"skip {key}: {exc}")
          PY

      - name: Run YouTube charts (no post)
        run: python -m tsm collect youtube --no-post
